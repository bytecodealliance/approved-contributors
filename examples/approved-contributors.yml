# Copy to .github/workflows/ in the repository you want to protect.
name: Approved Contributors
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: approved-contributors
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # Have a bytecodealliance org owner add the `ba-approved-contributors`
      # app to the repo this action is installed in, so that the action can
      # mint a token for read-write to the contributor-permissions repo.
      - id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.APPROVED_CONTRIBUTORS_APP_ID }}
          private-key: ${{ secrets.APPROVED_CONTRIBUTORS_APP_KEY }}
          owner: bytecodealliance
          repositories: contributor-permissions
      - uses: bytecodealliance/approved-contributors@v0.1
        with:
          permissions-repo: bytecodealliance/contributor-permissions
          allowlist-path: wasmtime-wasmtools-witbindgen-allowlist.txt
          blocklist-path: wasmtime-wasmtools-witbindgen-blocklist.txt
          permissions-token: ${{ steps.app-token.outputs.token }}
          vouch-team: bytecodealliance/wasmtime-core
          message: |
            Thanks for the PR, @{author}! This project only accepts pull
            requests from approved contributors, so it has been closed
            automatically. Please open an issue to discuss your change first.
          blocked-message: |
            @{author} is not permitted to contribute to this project, so this
            pull request has been closed automatically.
