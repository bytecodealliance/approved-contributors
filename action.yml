name: Approved Contributors
description: Close open pull requests whose authors lack write access and are not on an approved contributors list.
branding:
  icon: shield
  color: blue

inputs:
  permissions-repo:
    description: Repository (owner/name) holding the allowlist and blocklist.
    required: true
  permissions-ref:
    description: >
      Branch, tag, or SHA of permissions-repo to read. Defaults to its default
      branch. Must be a branch (or empty) when vouch-team is set.
    required: false
    default: ""
  permissions-token:
    description: >
      Token that can read permissions-repo. Defaults to the `token` input;
      needed when the lists are in a different private repository. When
      vouch-team is set, it must also be able to write permissions-repo
      contents and read the team's organization members.
    required: false
    default: ""
  allowlist-path:
    description: Path to the approved contributors list within permissions-repo.
    required: true
  blocklist-path:
    description: >
      Path to a list of blocked accounts within permissions-repo. Pull
      requests from blocked authors are closed with blocked-message even if
      they are on the allowlist. Authors with write access are never closed.
      The blocklist is disabled when empty.
    required: false
    default: ""
  vouch-team:
    description: >
      Team (org/team-slug) whose members can comment on a pull request with
      "/vouch allow" (or just "/vouch") to add its author to the allowlist
      and reopen it,
      "/vouch revoke" to remove its author from the allowlist, or
      "/vouch block" to add its author to the blocklist (requires
      blocklist-path). Vouching is disabled when empty.
    required: false
    default: ""
  message:
    description: >
      Comment posted on each pull request before closing it. "{author}" is
      replaced with the PR author's login. Hard-wrapped lines within a
      paragraph are joined; separate paragraphs with a blank line.
    required: true
  blocked-message:
    description: >
      Comment posted on each pull request from a blocked author before
      closing it. "{author}" is replaced with the PR author's login. Required
      when blocklist-path is set.
    required: false
    default: ""
  token:
    description: >
      Token used to list, comment on, and close pull requests, and to read
      collaborator permissions. Needs contents, pull-requests, and issues
      write access.
    required: false
    default: ${{ github.token }}

  dry-run:
    description: >
      When "true", make no changes to pull requests, the allowlist, or the
      blocklist; only print the audit log of actions a real run would take.
    required: false
    default: "false"

outputs:
  closed:
    description: JSON array of the pull request numbers that were closed.

runs:
  using: node24
  main: src/main.js
